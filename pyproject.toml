[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "audioglot"
version = "0.0.1"
authors = [
  { name="Andrew Schaub", email="aschaub930@gmail.com" },
]
description = "Transcribe and translate personal media library."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "tqdm>=4.64.0",
    "ffmpeg-python>=0.2.0",
    "pydub>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/drewschaub/audioglot"
Documentation = "https://github.com/drewschaub/audioglot#readme"
Repository = "https://github.com/drewschaub/audioglot"

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=0.9.0"]
whisper-cpp = ["whisper-cpp-python>=1.0.0"]
deepl = ["deepl>=1.15.0"]
google-translate = ["google-cloud-translate>=3.11.0"]
vad = ["silero-vad>=1.0.0"]
all = [
    "faster-whisper>=0.9.0",
    "whisper-cpp-python>=1.0.0",
    "deepl>=1.15.0",
    "google-cloud-translate>=3.11.0",
    "silero-vad>=1.0.0",
]
dev = [
    "pytest>=7.3.1",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
]

[project.scripts]
audioglot = "audioglot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100